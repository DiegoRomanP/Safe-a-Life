name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      # shortcut: acciones fijadas por tag y no por SHA, subir a SHA si se endurece la cadena de suministro.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Escanea solo el rango de commits del push/PR; el historial con el token de Penpot ya revocado no se reescanea.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Sin `npm ci`: el audit lee package-lock.json y no ejecuta scripts de dependencias (ADR-002).
      - run: npm audit --omit=dev

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # `engines` exige npm 12; el npm que trae Node 24 es anterior.
      - run: npm install -g npm@12.0.2
      # `npm ci` respeta allowScripts (ADR-002).
      - run: npm ci
        env:
          SCARF_ANALYTICS: 'false'
      - run: npm run lint
