# Render Blueprint del backend para la DEMO de bajo costo (ADR-001, ADR-004, ADR-005, ADR-009).
# Reglas:
#  - Ningún valor real en este archivo: todas las variables llevan `sync: false` (Render las pide al crear el Blueprint) salvo las no secretas.
#  - Un solo servicio web gratis con API y worker en el mismo contenedor (`sh start-demo.sh`, ADR-009). Cada proceso arranca sin
#    los secretos del otro. Cuando haya presupuesto se vuelve a dos servicios (web + worker, ADR-005): ver docs/Deploy-Runbook.md.
#  - Genera cada secreto con: node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"  (distintos entre sí).
#  - Primero se aplican las migraciones en Supabase (`supabase db push`): hasta entonces `/health/ready` responde 503.
# Detalle y lista de verificación en staging: docs/Deploy-Runbook.md.
services:
  - type: web
    name: save-a-life-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: sh start-demo.sh
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    plan: free # el día de la demo se puede subir a starter (sin dormir) desde el panel
    envVars:
      - key: NODE_ENV
        value: production
      # --- Supabase (la service_role solo la usa el adaptador de Auth Admin de la API, ADR-006; el worker no la ve) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- Topología (ADR-004): navegador y API comparten origen por el rewrite de Vercel; no hay CORS ---
      - key: ALLOWED_ORIGINS # https://<dominio del frontend>, sin barra final
        sync: false
      - key: TRUSTED_PROXIES # 5 (medido 2026-11-27): Express toma la IP más a la izquierda de X-Forwarded-For, que Vercel sobrescribe
        sync: false
      - key: EDGE_SHARED_SECRET # el mismo valor que EDGE_SHARED_SECRET en el proyecto de Vercel
        sync: false
      # --- Secretos solo de la API ---
      - key: CSRF_SECRET
        sync: false
      - key: CURSOR_SECRET
        sync: false
      - key: API_TECHNICAL_EMAIL
        sync: false
      - key: API_TECHNICAL_PASSWORD
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # --- Secretos solo del worker (usuario técnico distinto del de la API) ---
      - key: WORKER_EMAIL
        sync: false
      - key: WORKER_PASSWORD
        sync: false
      - key: WORKER_POLL_MS
        value: "10000"
      # --- Compartidos por API y worker ---
      - key: EMAIL_HMAC_SECRET
        sync: false
      - key: OUTBOX_KEYS # keyring kid:base64 de 32 bytes
        sync: false
      - key: OUTBOX_KEY_CURRENT
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_INBOX_ALLOWLIST # RF-EML-04: bandejas de prueba separadas por comas; con resend, vacía = no sale ningún correo
        sync: false
